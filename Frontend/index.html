<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Human Care Labs</title>

    <link rel="stylesheet" href="css/style.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <script src="script.js" defer></script>
    <main>

        <section class="auth-card">

            <div class="left-side">

                <h1>

                    Precision
                    Manufacturing for
                    Peak Performance.

                </h1>

                <p>

                    Join our clinical ecosystem and access
                    professional-grade nutraceuticals backed
                    by rigorous scientific standards.

                </p>


                <div class="badge">

                    <div class="icon">⚗</div>

                    <div class="icon">✔</div>

                    <span>GMP CERTIFIED EXCELLENCE</span>

                </div>

            </div>




            <div class="right-side">

                <div class="tabs">

                    <button id="loginBtn" class="active-tab">
                        Login
                    </button>

                    <button id="registerBtn">
                        Create Account
                    </button>

                    <div class="tab-slider"></div>

                </div>

                <div class="form-wrapper">
                    <div class="forms">

                        <form id="loginForm" class="login-form">
                            <div id="message" class="error-message"></div>

                            <div class="input-group">
                                <label>Email Address</label>
                                <input type="text" id="email" placeholder="Enter your email">
                            </div>

                            <div class="input-group">
                                <div class="password-row">
                                    <label>Password</label>

                                    <a href="#">
                                        Forgot Password?
                                    </a>
                                </div>

                                <div class="password-wrapper">
                                    <input type="password" id="password" placeholder="Enter Password" required>
                                    <span id="togglePassword" class="toggle-password">
                                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                    </span>
                                </div>
                            </div>

                            <div class="remember">

                                <input type="checkbox">

                                <label>
                                    Remember Me
                                </label>

                            </div>

                            <button class="signin">
                                Sign In
                            </button>

                        </form>


                        <form class="register-form">

                            <div class="input-row">
                                <div class="input-group">
                                    <label>Full Name</label>
                                    <input type="text" placeholder="John Doe">
                                </div>
                                <div class="input-group">
                                    <label>Phone Number</label>
                                    <input type="tel" placeholder="Phone Number">
                                </div>
                            </div>

                            <div class="input-group">
                                <label>Email Address</label>
                                <input type="email" placeholder="john@email.com">
                            </div>

                            <div class="input-row">
                                <div class="input-group">
                                    <label>Password</label>
                                    <input type="password" placeholder="Password">
                                </div>
                                <div class="input-group">
                                    <label>Confirm Password</label>
                                    <input type="password" placeholder="Confirm Password">
                                </div>
                            </div>

                            <button class="signin">

                                Create Account

                            </button>

                        </form>

                    </div>

                </div>

                <div class="divider">

                    <span></span>

                    <p>AUTHORIZED ACCESS ONLY</p>

                    <span></span>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
